name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & Create Minimal App
        run: |
          mkdir -p app/src/main/java/com/bhanu/mobileai app/src/main/res/layout app/src/main/res/values
          cat << 'EOF' > settings.gradle.kts
          rootProject.name = "MobileAIController"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.bhanu.mobileai"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.bhanu.mobileai"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("androidx.constraintlayout:constraintlayout:2.1.4")
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="Mobile AI Controller"
                  android:theme="@style/Theme.Material3.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Mobile AI Controller</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="20dp">

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Mobile AI Controller"
                  android:textSize="22sp"
                  android:textStyle="bold"
                  android:layout_marginBottom="12dp" />

              <EditText
                  android:id="@+id/etServerUrl"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:hint="Server URL"
                  android:text="https://narrative-windsor-investigations-legislative.trycloudflare.com"
                  android:inputType="textUri"
                  android:layout_marginBottom="12dp" />

              <Button
                  android:id="@+id/btnConnect"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Connect to Dashboard"
                  android:layout_marginBottom="16dp" />

              <TextView
                  android:id="@+id/tvStatus"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Status: Ready"
                  android:textSize="16sp" />
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/bhanu/mobileai/MainActivity.kt
          package com.bhanu.mobileai

          import android.os.Bundle
          import android.widget.Button
          import android.widget.EditText
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import java.net.HttpURLConnection
          import java.net.URL
          import kotlin.concurrent.thread

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  val etUrl = findViewById<EditText>(R.id.etServerUrl)
                  val btnConnect = findViewById<Button>(R.id.btnConnect)
                  val tvStatus = findViewById<TextView>(R.id.tvStatus)

                  btnConnect.setOnClickListener {
                      val rawUrl = etUrl.text.toString().trim().removeSuffix("/")
                      if (rawUrl.isEmpty()) {
                          tvStatus.text = "Status: Enter valid URL"
                          return@setOnClickListener
                      }
                      tvStatus.text = "Status: Connecting..."
                      thread {
                          try {
                              val conn = URL(rawUrl).openConnection() as HttpURLConnection
                              conn.connectTimeout = 8000
                              conn.readTimeout = 8000
                              val code = conn.responseCode
                              runOnUiThread {
                                  tvStatus.text = "Status: Connected (HTTP $code)"
                              }
                          } catch (e: Exception) {
                              runOnUiThread {
                                  tvStatus.text = "Status: Failed (${e.localizedMessage})"
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Setup Gradle Wrapper & Build APK
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ai-controller-apk
          path: app/build/outputs/apk/debug/app-debug.apk
